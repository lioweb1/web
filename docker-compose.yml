# Local PostgreSQL for development. App and worker run on the host with `npm run dev` / `npm run worker`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
volumes:
  pgdata:
